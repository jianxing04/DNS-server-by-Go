apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: dns-firewall
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS dns;
    USE dns;

    CREATE TABLE IF NOT EXISTS dns_domain_stats (
        id BIGINT AUTO_INCREMENT PRIMARY KEY,
        domain VARCHAR(255) NOT NULL,
        stat_date DATE NOT NULL,
        stat_hour TINYINT NOT NULL,
        access_count BIGINT NOT NULL DEFAULT 0,
        UNIQUE KEY uk_domain_time (domain, stat_date, stat_hour)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS security_rules (
        id bigint(20) unsigned NOT NULL AUTO_INCREMENT,
        rule_type varchar(32) NOT NULL,
        rule_value varchar(255) NOT NULL,
        is_enabled tinyint(1) NOT NULL DEFAULT '1',
        description varchar(255) DEFAULT '',
        created_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        KEY idx_enabled_type (is_enabled, rule_type),
        UNIQUE KEY uk_type_value (rule_type, rule_value)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    INSERT INTO security_rules (rule_type, rule_value, description)
    SELECT * FROM (
        SELECT 'client_ip' AS rule_type, '192.168.1.0/24' AS rule_value, '内网测试拦截' AS description
        UNION ALL SELECT 'domain', 'ads.google.com.', '拦截谷歌广告'
        UNION ALL SELECT 'domain', 'badguy.net.', '拦截恶意域名'
        UNION ALL SELECT 'target_ip', '10.255.255.254/32', '拦截特定解析目标IP'
    ) tmp
    WHERE NOT EXISTS (SELECT 1 FROM security_rules LIMIT 1);
