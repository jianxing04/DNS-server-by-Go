apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-firewall
  namespace: dns-firewall
  labels:
    app: dns-firewall
    app.kubernetes.io/name: dns-firewall
    app.kubernetes.io/version: "v1.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dns-firewall
  template:
    metadata:
      labels:
        app: dns-firewall
        app.kubernetes.io/name: dns-firewall
        app.kubernetes.io/version: "v1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dns-firewall
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup mysql.dns-firewall.svc.cluster.local; do
                echo "等待 MySQL 就绪..."
                sleep 2
              done
              echo "MySQL DNS 已解析"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup redis.dns-firewall.svc.cluster.local; do
                echo "等待 Redis 就绪..."
                sleep 2
              done
              echo "Redis DNS 已解析"
      containers:
        - name: dns-firewall
          image: dns-firewall:latest
          imagePullPolicy: IfNotPresent
          command: ["./dns-firewall"]
          args: ["-config", "/etc/dns-firewall/config.yaml"]
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dns-firewall-secret
                  key: mysql-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dns-firewall-secret
                  key: redis-password
          ports:
            - name: dns-udp
              containerPort: 8053
              protocol: UDP
            - name: metrics
              containerPort: 2112
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dns-firewall
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2112
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 2112
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
            runAsNonRoot: false
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap:
            name: dns-firewall-config
