services:
  # 1. 缓存层
  redis-server:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"

  # 2. 持久层
  mysql-server:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dns
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 3. 计算层 (DNS 节点 1)
  dns-node-1:
    build: .
    depends_on:
      - mysql-server
      - redis-server
    ports:
      - "2112:2112"

  # 计算层 (DNS 节点 2)
  dns-node-2:
    build: .
    depends_on:
      - mysql-server
      - redis-server
    ports:
      - "2113:2112"

  # 计算层 (DNS 节点 3)
  dns-node-3:
    build: .
    depends_on:
      - mysql-server
      - redis-server
    ports:
      - "2114:2112"

  # 4. 接入层 (Nginx UDP 负载均衡)
  nginx-lb:
    image: nginx:alpine
    ports:
      - "53:53/udp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dns-node-1
      - dns-node-2
      - dns-node-3